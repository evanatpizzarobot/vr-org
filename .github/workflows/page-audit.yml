name: Page maintenance audit

on:
  schedule:
    # Mondays at 17:00 UTC (9am Pacific, 10am Pacific during DST)
    - cron: "0 17 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run page audit
        id: audit
        run: |
          set +e
          pages=$(node scripts/audit-pages.mjs --due)
          pages_status=$?
          # Page-level cadence cannot see an individual tracker item going stale,
          # so the item check runs alongside it and shares the same issue.
          items=$(node scripts/check-release-dates.mjs)
          items_status=$?
          # Dead images on a commercial page ship silently to readers. --ci
          # collapses the unverified list, which is long from CI IPs.
          links=$(node scripts/check-deal-links.mjs --ci)
          links_status=$?
          # Report-only and deliberately excluded from the status: ad density is
          # an editorial call, so this informs the monthly revenue check-in
          # rather than gating anything.
          ads=$(node scripts/check-ad-coverage.mjs || true)
          output=$(printf '%s\n\n%s\n\n%s\n\n%s\n' "$pages" "$items" "$links" "$ads")
          status=0
          if [ "$pages_status" -ne 0 ] || [ "$items_status" -ne 0 ] || [ "$links_status" -ne 0 ]; then
            status=1
          fi
          echo "$output"
          {
            echo "report<<AUDIT_EOF"
            echo "$output"
            echo "AUDIT_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update issue when overdue
        if: steps.audit.outputs.status != '0'
        env:
          AUDIT_REPORT: ${{ steps.audit.outputs.report }}
        uses: actions/github-script@v7
        with:
          script: |
            const report = process.env.AUDIT_REPORT || "";
            const today = new Date().toISOString().slice(0, 10);
            const title = "Page maintenance: refreshes overdue";
            const labelName = "page-audit";

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: "fbca04",
                  description: "Stale page refresh tracking",
                });
              } else {
                throw e;
              }
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: labelName,
            });

            const body = [
              "Weekly audit at " + today + " UTC found overdue refreshes.",
              "",
              "```",
              report,
              "```",
              "",
              "Run `npm run audit:pages -- --due` locally to see the per-page checklist. After refreshing each page, bump `lastRefreshed` in `data/page-maintenance.json` so the audit stops flagging it.",
              "",
              "If the report lists items under SHIPPED BUT STILL LISTED AS UPCOMING, fix those in `data/release-dates.json` first: they are rendering on the /deals Coming Soon strip as upcoming releases. Re-check with `npm run check:release-dates`.",
            ].join("\n");

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
              core.info("Updated existing issue #" + existing[0].number);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [labelName],
              });
              core.info("Created issue #" + created.number);
            }

      - name: Close issue when all fresh
        if: steps.audit.outputs.status == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const labelName = "page-audit";
            const today = new Date().toISOString().slice(0, 10);
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: labelName,
            });
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "All pages within cadence as of " + today + " UTC. Closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
              core.info("Closed issue #" + issue.number);
            }
