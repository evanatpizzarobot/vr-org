services:
  vrorg:
    build: .
    container_name: vr-org
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./data:/app/data
      - /var/log/nginx:/var/log/nginx:ro
    mem_limit: 512m
